# =============================================================================
# mixgrid · 混合网格定义
#
# 口径（与 wakman 的 S/M/A 网格同构，但按本项目「按 token 定压力」的惯例改成份额制）：
#
#   mix = 四类负载的 **prompt token 份额（%）**，不是会话数份额。
#   理由：缓存压力由 token 量决定，而会话粒度差两个数量级
#   （apps ≈0.4k token/条，agentic ≈89k token/条）；按会话数配比会让
#   「25% 的会话」变成「95% 的 token」，mix 名同实异。
#
#   T = apps   单轮冲刷（无复用）        → 期望落 qtrans / one-shot 带
#   S = struct 跨会话共享前缀（单轮）    → 期望落 qstruct
#   C = chat   多轮人工会话（间隔长）    → 期望落 qchat
#   A = agentic 多轮 agent（间隔短）     → 期望落 qagent
#
#   队列名只是**期望**：HeterCache 由状态机按「是否复用 / 复用间隔 / 树分支」
#   自动归类，所以每个 mix 都要用 realized 份额回验（run_sim.py 会打印）。
#
# 三个不变量（跨 mix 必须相同，否则混比结论被压力差污染）：
#   1. token_rate  恒定 → 单位时间进入缓存的 token 量相同
#   2. capacity    恒定 → 池子大小相同
#   3. seed        恒定 → max_record 截断是同一 shuffle 的嵌套子集，
#                        不同 mix 之间只差「配比」，不差「换了哪批会话」
#
# 单 run 预算 B = min(budget_cap, min_i pool_tokens_i / share_i)
#   —— 份额优先于规模：任何一类都不会跑到没数据，宁可总 token 少一点。
# 时长 T = B / token_rate（各 mix 不同，报告里必须写出来）。
# 每类会话数 n_i = share_i · B / mean_tokens_i；λ_i = n_i / T。
# =============================================================================

token_rate: 2000.0      # tok/s（exp3 的 24.5M / 12000s ≈ 2040，取整）
budget_cap: 8000000     # 单 run 上限 8M prompt token ≈ 真机 67 min（Q=2000）
seed: 42                # 所有 mix 共用（嵌套子集，见上）

# 四类负载的**池子**：一个类一份文件，所有 mix 共用，只改 max_record / λ。
# data_path 相对 Heter-Bench 根目录；也可写绝对路径。
classes:
  T:
    task_id: 0
    name: apps
    data_path: TaskData/AgentBankData/Qwen2.5-7B-Instruct/AgentBank_apps_session_data.nosys.jsonl
    mu: 0.0             # 单轮：无轮间空窗
    sigma: 0.0
  S:
    task_id: 1
    name: struct
    data_path: TaskData/mixgrid/pools/struct.nosys.jsonl
    mu: 0.0
    sigma: 0.0
  C:
    task_id: 2
    name: chat
    data_path: TaskData/SharedGPT-multi-turn/Qwen2.5-7B-Instruct/ShareGPT_cleaned_valid_deduplicated_session_data.nosys.mt2.jsonl
    mu: 4.15            # 与 configs/hybrid_tasks_config.yaml 同源
    sigma: 0.971
  A:
    task_id: 3
    name: agentic
    data_path: TaskData/AgentBankData/Qwen2.5-7B-Instruct/AgentBank_alfred_scale_5000_session_data.nosys.jsonl
    mu: 1.81
    sigma: 1.092

# ---------------------------------------------------------------------------
# 20 个 mix（share 之和必须 100）
#
#   vertex   4 个顶点：单个队列的「天花板 / 地板」，给其它 mix 当参照
#   family   6 个：单轮族 T+S / 多轮族 C+A 内部拆解
#            —— T vs S 是本项目 VD 最容易混的一对；C vs A 只差轮间间隔
#   edge     8 个跨族两两 70/30：某类压倒性主导时，别类会不会被饿死
#   interior 2 个：均衡点 + 单轮偏重的内部点
# ---------------------------------------------------------------------------
grid:
  # --- vertex ---------------------------------------------------------------
  - {id: v_T100, group: vertex, share: {T: 100}}
  - {id: v_S100, group: vertex, share: {S: 100}}
  - {id: v_C100, group: vertex, share: {C: 100}}
  - {id: v_A100, group: vertex, share: {A: 100}}

  # --- family ---------------------------------------------------------------
  - {id: f_TS70_30, group: family, share: {T: 70, S: 30}}
  - {id: f_TS50_50, group: family, share: {T: 50, S: 50}}
  - {id: f_TS30_70, group: family, share: {T: 30, S: 70}}
  - {id: f_CA70_30, group: family, share: {C: 70, A: 30}}
  - {id: f_CA50_50, group: family, share: {C: 50, A: 50}}
  - {id: f_CA30_70, group: family, share: {C: 30, A: 70}}

  # --- edge（跨族 70/30）-----------------------------------------------------
  - {id: e_TC70_30, group: edge, share: {T: 70, C: 30}}
  - {id: e_TC30_70, group: edge, share: {T: 30, C: 70}}
  - {id: e_TA70_30, group: edge, share: {T: 70, A: 30}}
  - {id: e_TA30_70, group: edge, share: {T: 30, A: 70}}
  - {id: e_SC70_30, group: edge, share: {S: 70, C: 30}}
  - {id: e_SC30_70, group: edge, share: {S: 30, C: 70}}
  - {id: e_SA70_30, group: edge, share: {S: 70, A: 30}}
  - {id: e_SA30_70, group: edge, share: {S: 30, A: 70}}

  # --- interior -------------------------------------------------------------
  - {id: i_2525, group: interior, share: {T: 25, S: 25, C: 25, A: 25}}
  - {id: i_T40, group: interior, share: {T: 40, S: 30, C: 15, A: 15}}
