# exp3 · 相位排程：稳态基线 + 周期性突发窗口
#
# 40 个 300 秒周期（合计 3 小时），每周期 280 秒基线 + 20 秒突发：
#   基线期各类按各自到达率均匀投放；
#   突发期同一批会话在 20 秒内集中到达（到达率放大 10 倍），随后回到基线。
#
# 会话总数与 mix_full.yaml 一致（apps 15 000 / chat 800 / agentic 96 / struct 2 600）。
# 用法：bash mixexp/run_mixexp.sh --scale full --mode drift ...
#       （--mode drift 即相位模式，读取本目录下的 drift_phases.yaml）
#
# data_path 相对 Heter-Bench 根目录解析。
# chat / agentic 两类带 min_turns: 5（= MULTI_TURN_MIN），bench 起跑前校验
# 选中会话都活得到非 TRANS 轮次；chat 的源是 prepare_data.sh 步 2 的 *.mt5.jsonl。
tasks:
  - name: AgentBank_alfred
    task_id: 3
    data_path: TaskData/exp3/agentic_exp3.nosys.jsonl
    min_turns: 5
    mu: 1.81
    sigma: 1.092
    seed: 42

  - name: ShareGPT
    task_id: 2
    data_path: TaskData/exp3/chat_exp3.nosys.jsonl
    min_turns: 5
    mu: 4.15
    sigma: 0.971
    seed: 42

  - name: AgentBank_apps
    task_id: 0
    data_path: TaskData/exp3/apps_exp3.nosys.jsonl
    mu: 0
    sigma: 0
    seed: 42

  - name: Struct
    task_id: 4
    data_path: TaskData/exp3/struct_exp3.nosys.jsonl
    mu: 0
    sigma: 0
    seed: 42

phases:
  # ── 周期 01 · baseline ──
  - name: c01_baseline
    duration_s: 280
    lambda_rate:
      ShareGPT: 0.0643
      AgentBank_apps: 1.2071
      Struct: 0.2107
      AgentBank_alfred: 0.0071
    max_record:
      ShareGPT: 18
      AgentBank_apps: 338
      Struct: 59
      AgentBank_alfred: 2

  # ── 周期 01 · burst ──
  - name: c01_burst
    duration_s: 20
    lambda_rate:
      ShareGPT: 1.0000
      AgentBank_apps: 18.5000
