# Cascade R3：异构 idle（H=10s / W=30s / C=90s）—— 主格
# 时间轴：12 victim 同时到达 → turn1..20 (gap=1s) → 屏障 → pause(10/30/90s) → turn21..26
# 压力：ShareGPT 单轮（MULTI_TURN_TEXT）→ 落在**可调度带**。
#   首版用 apps/Codeparrot（one-shot 带）时，profile 显示 evicted single 33,798 /
#   agentic 2,407：压力全被 one-shot 带吃掉，受害者无损，故改为可调度搅拌。
#   20 条 × 601 tok ≈ 12k tok 注入，F_eff ≈ 126 tok/s。
